<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="glow" />
      <feComposite in="SourceGraphic" in2="glow" operator="over" />
    </filter>
  </defs>
  <!-- Shield Outer -->
  <path d="M50 10 L82 24 C82 55 68 78 50 90 C32 78 18 55 18 24 Z" 
        fill="#0f172a" 
        stroke="url(#shieldGrad)" 
        stroke-width="4" 
        stroke-linejoin="round" />
  <!-- Shield Inner Accent -->
  <path d="M50 18 L76 30 C76 56 64 74 50 84 C36 74 24 56 24 30 Z" 
        fill="rgba(16, 185, 129, 0.08)" />
  <!-- Pulse Wave -->
  <path d="M30 52 L40 52 L45 38 L52 64 L58 44 L64 52 L70 52" 
        stroke="#10b981" 
        stroke-width="4.5" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#glow)" />
  <!-- Pulse Center Beacon -->
  <circle cx="52" cy="64" r="2.5" fill="#34d399" />
</svg>
